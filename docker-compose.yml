# One-command local stack:  docker compose up --build
#   Web:  http://localhost:8080      API: http://localhost:5000/api
# Requires a root .env (copy .env.example) providing JWT_SECRET and seed credentials.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  seed:
    build: ./server
    command: ["node", "scripts/seed.js", "--if-empty"]
    environment: &api-env
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/product-catalog
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      CORS_ORIGINS: http://localhost:8080
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  api:
    build: ./server
    restart: unless-stopped
    environment: *api-env
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  web:
    build: ./client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongo-data:
